<script id="plan-md" type="text/markdown">
# 레거시 쇼핑몰 FSD 마이그레이션

## 1. 개요
- 작업 유형: migrate
- 요청 사항: 기존 Next.js 쇼핑몰(pages + components 플랫 구조)을 FSD 아키텍처로 전환
- 현재 구조: pages 기반 + components/ 플랫 구조 + 로직/UI 혼재

## 2. 현재 상태 분석

### 현재 구조
```
src/
├── pages/           ← App Router 아님 (pages 기반)
├── components/      ← 모든 컴포넌트 플랫 나열 (역할 구분 없음)
├── hooks/           ← 비즈니스 + 서버상태 + UI상태 혼재
├── types/           ← 타입이 코드와 분리되어 있음
├── api/             ← 모든 API 한 폴더
├── utils/           ← 유틸
└── styles/          ← 스타일
```

### 발견된 문제
- **components/ 플랫 구조**: Header, ProductCard, SearchBar가 같은 레벨에 혼재
- **로직/UI 혼재**: ProductCard에서 cartApi 직접 호출
- **hooks 혼재**: useProducts(서버 상태), useCart(비즈니스 로직), useAuth(인증) 구분 없음
- **타입 분리**: types/가 별도 폴더에 있어 관련 코드와 거리가 멀음

## 4. 작업 순서

Phase별 순차 실행, 매 Phase 빌드 확인.

## 5. Import 의존성 (마이그레이션 후)

```
app/* → widgets/header + widgets/footer
app/ → widgets/product-list
app/cart → widgets/cart-view
widgets/product-list → features/search + features/cart + entities/product
widgets/cart-view → features/checkout + entities/cart
features/cart → entities/cart + entities/product
features/search → entities/product
features/auth → entities/user
```

## 6. 위험 요소
- **pages → app 전환**: 라우팅 방식 변경으로 일시적 깨짐 가능
- **ProductCard 리팩토링**: cartApi 직접 호출 → props 주입으로 변경 필요
- **import 경로 일괄 변경**: 모든 파일에 영향
- **기존 테스트**: 경로 변경으로 깨질 수 있음

## 7. FSD 검증 체크리스트
- ✅ 단방향 의존성: app → widgets → features → entities → shared
- ✅ entities에 UI 없음 (타입 + API만)
- ✅ shared에 도메인 코드 없음 (StarRating, formatPrice만)
- ✅ features끼리 교차 import 없음
- ✅ 각 슬라이스 index.ts public API

    <details class="preview"><summary>복사될 프롬프트 미리보기</summary><pre class="prompt-out" id="preview"></pre></details>
  </div>
</div>
<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="status" id="status"></div>
    <button id="btn-json">JSON 복사</button>
    <button class="primary" id="btn-copy">프롬프트로 복사</button>
  </div>
</div>
<div class="toast" id="toast">복사되었습니다</div>
<script>
const _fileIconMap = { '.tsx':'react','.ts':'typescript','.scss':'sass','.css':'css3','.json':'nodejs','.md':'markdown','.html':'html5','.js':'javascript','.jsx':'react' };
function getFileIcon(name) { const ext = '.' + name.split('.').pop(); const d = _fileIconMap[ext]; return d ? '<i class="devicon-'+d+'-plain colored" style="font-size:16px"></i>' : '<i class="mdi mdi-file-outline" style="font-size:16px;color:#8b949e"></i>'; }
function highlightMove(el) {
  // 기존 상태 클리어
  document.querySelectorAll('.before-file.active').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.fsd-highlight').forEach(e => e.classList.remove('fsd-highlight'));
  document.querySelectorAll('.move-line').forEach(e => e.remove());

  el.classList.add('active');
  const moveTo = el.dataset.moveTo;
  if (!moveTo) return;

  // FSD 트리에서 대상 파일 찾기 (data-fsd-path로 정확 매칭)
  const moveToPath = moveTo.replace('src/', '');
  let targetRow = null;

  document.querySelectorAll('[data-fsd-path]').forEach(row => {
    if (row.dataset.fsdPath === moveToPath) {
      targetRow = row;
      row.classList.add('fsd-highlight');

      // 부모 폴더 열기
      let parent = row.closest('.tree-folder-children');
      while (parent) {
        parent.classList.remove('collapsed');
        const icon = document.getElementById(parent.id + '-icon');
        if (icon) icon.className = 'mdi mdi-folder-open';
        parent = parent.parentElement?.closest('.tree-folder-children');
      }
      let layerBody = row.closest('.tree-body');
      if (layerBody && !layerBody.classList.contains('open')) {
        layerBody.classList.add('open');
        layerBody.previousElementSibling?.querySelector('.arrow-icon')?.classList.add('open');
      }
    }
  });

  if (!targetRow) return;

  // 대상 파일로 스크롤 + 깜빡임
  setTimeout(() => targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
}

function toggleFolder(id) {
  const children = document.getElementById(id);
  const icon = document.getElementById(id + '-icon');
  children.classList.toggle('collapsed');
  icon.className = children.classList.contains('collapsed') ? 'mdi mdi-folder' : 'mdi mdi-folder-open';
}
(function () {
  const state = {};
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const decidedList = (d) => d.decided == null ? null : Array.isArray(d.decided) ? d.decided : [d.decided];
  const isConfirmed = (d) => decidedList(d) !== null;
  const allConfirmed = () => PLAN.decisions.length > 0 && PLAN.decisions.every(d => !d.required || isConfirmed(d));

  document.getElementById('p-title').textContent = PLAN.title;
  document.getElementById('p-summary').textContent = PLAN.summary || '';
  const tb = document.getElementById('p-type'); tb.textContent = PLAN.type; tb.classList.add('type-' + PLAN.type);
  document.getElementById('p-scope').textContent = '범위: ' + PLAN.scope;
  const ml = document.getElementById('p-mdlink'); ml.innerHTML = '원본 → <code>' + esc(PLAN.mdFile) + '</code>'; ml.href = PLAN.mdFile.split('/').pop();

  const container = document.getElementById('decisions');
  PLAN.decisions.forEach(dec => {
    const confirmed = isConfirmed(dec); const preset = decidedList(dec) || [];
    state[dec.id] = { picks: new Set(preset) };
    const card = el('div', 'card' + (confirmed ? ' confirmed' : '')); card.dataset.id = dec.id;
    card.appendChild(el('div', 'card-head', '<h3 class="card-title">' + esc(dec.title) + (dec.required ? ' *' : '') + '</h3><span class="pick-tag">' + (dec.type === 'multi' ? '복수 선택' : '택1') + '</span>'));
    if (dec.desc) card.appendChild(el('p', 'card-desc', esc(dec.desc)));
    const opts = el('div', 'options');
    dec.options.forEach(opt => {
      const row = el('div', 'option'); row.dataset.type = dec.type;
      if (preset.includes(opt.label)) row.classList.add('selected');
      row.innerHTML = '<div class="marker"></div><div class="opt-body"><div class="opt-label">' + esc(opt.label) + (opt.recommended ? '<span class="rec">추천</span>' : '') + '</div>' + (opt.desc ? '<div class="opt-desc">' + esc(opt.desc) + '</div>' : '') + '</div>';
      if (!confirmed) row.addEventListener('click', () => { const p = state[dec.id].picks; if (dec.type === 'single') { p.clear(); opts.querySelectorAll('.option').forEach(n => n.classList.remove('selected')); p.add(opt.label); row.classList.add('selected'); } else { if (p.has(opt.label)) { p.delete(opt.label); row.classList.remove('selected'); } else { p.add(opt.label); row.classList.add('selected'); } } render(); });
      opts.appendChild(row);
    });
    card.appendChild(opts); container.appendChild(card);
  });

  function valueFor(d) { return [...state[d.id].picks].join(', '); }
  function unresolved() { return PLAN.decisions.filter(d => d.required && state[d.id].picks.size === 0); }
  function buildPrompt() {
    const l = ['[작업계획서 결정사항 확정] ' + PLAN.title, '', '아래 결정사항으로 ' + PLAN.mdFile + ' 계획서를 확정하고 진행해주세요.', ''];
    PLAN.decisions.forEach((d, i) => l.push((i+1) + '. ' + d.title + ': ' + (valueFor(d) || '(미결정)')));
    l.push('', '추가 메모: ' + (document.getElementById('notes').value.trim() || '(없음)'));
    return l.join('\n');
  }
  function buildJson() {
    const o = { title: PLAN.title, mdFile: PLAN.mdFile, decisions: {}, notes: document.getElementById('notes').value.trim() };
    PLAN.decisions.forEach(d => { o.decisions[d.title] = valueFor(d); });
    return JSON.stringify(o, null, 2);
  }
  function render() {
    PLAN.decisions.forEach(d => {
      const card = container.querySelector('[data-id="'+d.id+'"]'), tag = card.querySelector('.pick-tag');
      const decided = state[d.id].picks.size > 0;
      card.classList.toggle('unresolved', d.required && !decided && !isConfirmed(d));
      if (decided) { tag.classList.add('done'); tag.textContent = (isConfirmed(d) ? '✅ 확정 · ' : '✓ ') + valueFor(d); }
      else { tag.classList.remove('done'); tag.textContent = d.type === 'multi' ? '복수 선택' : '택1'; }
    });
    const left = unresolved(), st = document.getElementById('status');
    if (left.length === 0) st.innerHTML = '<b>모든 필수 결정 완료.</b> 복사해서 채팅에 붙여넣으세요.';
    else st.innerHTML = '필수 결정 <b>' + left.length + '개</b> 남음: ' + left.map(d => esc(d.title)).join(', ');
    document.getElementById('btn-copy').disabled = left.length > 0;
    document.getElementById('preview').textContent = buildPrompt();
  }
  function applyLifecycle() {
    const confirmed = allConfirmed(), bar = document.getElementById('statusbar'), bt = document.getElementById('statusbar-text');
    if (confirmed) { bar.className = 'statusbar confirmed'; bt.textContent = '✅ 확정 완료'; document.getElementById('notes-card').style.display='none'; document.querySelector('details.preview').style.display='none'; document.getElementById('actionbar').style.display='none'; document.querySelector('.wrap').style.paddingBottom='60px'; }
    else { bar.className = 'statusbar pending'; bt.textContent = '결정 대기 — 필수 항목을 선택해 [프롬프트로 복사] 후 채팅에 붙여넣어 주세요.'; }
  }

  // md 렌더
  (function () {
    const raw = (document.getElementById('plan-md').textContent || '').trim();
    if (!raw) return;
    document.getElementById('body-title').style.display = '';
    const body = document.getElementById('plan-body'); body.style.display = '';
    const me = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const mi = s => { let o = me(s); o = o.replace(/`([^`]+)`/g, '<code>$1</code>'); o = o.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); return o; };
    const sr = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
    const lines = raw.replace(/\r\n/g,'\n').split('\n'); let html = '', i = 0;
    const isSp = l => /^#{1,6}\s/.test(l)||/^```/.test(l)||/^\s*\|.*\|\s*$/.test(l)||/^\s*[-*]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)||/^\s*---+\s*$/.test(l)||/^\s*>/.test(l)||/^\s*$/.test(l);
    while (i < lines.length) {
      const l = lines[i];
      if (/^```/.test(l)) { i++; const b=[]; while(i<lines.length&&!/^```/.test(lines[i])){b.push(lines[i]);i++;} i++; html+='<pre class="md-code"><code>'+me(b.join('\n'))+'</code></pre>'; continue; }
      if (/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])) { const h=sr(l); i+=2; const r=[]; while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){r.push(sr(lines[i]));i++;} html+='<table><thead><tr>'+h.map(c=>'<th>'+mi(c)+'</th>').join('')+'</tr></thead><tbody>'+r.map(row=>'<tr>'+row.map(c=>'<td>'+mi(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; continue; }
      const hd = l.match(/^(#{1,6})\s+(.*)$/); if (hd) { html+='<h'+hd[1].length+'>'+mi(hd[2])+'</h'+hd[1].length+'>'; i++; continue; }
      if (/^\s*---+\s*$/.test(l)) { html+='<hr>'; i++; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord=/^\s*\d+\.\s+/.test(l), b=[]; while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){b.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));i++;} html+=(ord?'<ol>':'<ul>')+b.map(x=>'<li>'+mi(x)+'</li>').join('')+(ord?'</ol>':'</ul>'); continue; }
      if (/^\s*$/.test(l)) { i++; continue; }
      const b=[l]; i++; while(i<lines.length&&!isSp(lines[i])){b.push(lines[i]);i++;} html+='<p>'+mi(b.join(' '))+'</p>';
    }
    body.innerHTML = html;
  })();

  // 현재 상태 분석 시각화 ("현재 상태 분석" 또는 "현재 구조" 헤딩 아래 삽입)
  (function () {
    if (!PLAN.issues) return;
    const body = document.getElementById('plan-body');
    if (!body) return;

    let targetH2 = null;
    body.querySelectorAll('h2').forEach(h => {
      if (h.textContent.includes('현재 상태') || h.textContent.includes('현재 구조')) targetH2 = h;
    });
    if (!targetH2) return;

    // 기존 내용(코드블록, 리스트 등) 다음 h2까지 모두 제거하고 교체
    const toRemove = [];
    let el2 = targetH2.nextElementSibling;
    while (el2 && el2.tagName !== 'H2') { toRemove.push(el2); el2 = el2.nextElementSibling; }
    toRemove.forEach(e => e.remove());

    const critical = PLAN.issues.filter(i => i.severity === 'critical').length;
    const warning = PLAN.issues.filter(i => i.severity === 'warning').length;
    const info = PLAN.issues.filter(i => i.severity === 'info').length;

    let html = '';

    // 요약
    html += '<div class="analysis-summary">';
    if (critical) html += '<div class="analysis-count critical"><i class="mdi mdi-alert-circle" style="font-size:16px"></i> Critical ' + critical + '개</div>';
    if (warning) html += '<div class="analysis-count warning"><i class="mdi mdi-alert" style="font-size:16px"></i> Warning ' + warning + '개</div>';
    if (info) html += '<div class="analysis-count info"><i class="mdi mdi-information" style="font-size:16px"></i> Info ' + info + '개</div>';
    html += '</div>';

    // Issue 카드
    PLAN.issues.forEach(issue => {
      html += '<div class="issue-card ' + issue.severity + '">';
      html += '<div class="issue-header">';
      html += '<span class="issue-severity ' + issue.severity + '">' + issue.severity + '</span>';
      html += '<i class="mdi ' + issue.icon + '" style="font-size:14px;color:var(--muted)"></i>';
      html += '<span class="issue-category">' + esc(issue.category) + '</span>';
      html += '</div>';
      html += '<div class="issue-file">' + esc(issue.file);
      if (issue.lines) html += '<span class="issue-lines">' + issue.lines + '줄</span>';
      html += '</div>';
      html += '<div class="issue-desc">' + esc(issue.desc) + '</div>';
      html += '<div class="issue-suggestion"><i class="mdi mdi-arrow-right-circle" style="font-size:14px;flex-shrink:0;margin-top:1px"></i> ' + esc(issue.suggestion) + '</div>';
      html += '</div>';
    });

    // Before 구조 + 클릭 시 FSD 레이어 배치에서 하이라이트
    if (PLAN.beforeAfter) {
      html += '<h3 style="margin-top:24px;font-size:15px;color:var(--text)">현재 폴더 구조 <span style="font-size:12px;color:var(--muted);font-weight:400">파일 클릭 → 이동 경로 하이라이트</span></h3>';

      const buildBeforeTree = (items) => {
        const root = {};
        items.forEach(item => {
          const parts = item.path.replace('src/', '').split('/').filter(Boolean);
          let node = root;
          parts.forEach((p, i) => {
            if (!node[p]) node[p] = i === parts.length - 1 && item.type === 'file' ? { __item: item } : {};
            node = node[p];
          });
        });
        return root;
      };

      // 레이어 색상 매핑
      const layerColors = {};
      if (PLAN.layers) PLAN.layers.forEach(l => { layerColors[l.name] = l.color; });
      const getMoveColor = (moveTo) => {
        if (!moveTo) return '';
        const layer = moveTo.replace('src/', '').split('/')[0];
        return layerColors[layer] || '#58a6ff';
      };
      const getMoveLayer = (moveTo) => {
        if (!moveTo) return '';
        return moveTo.replace('src/', '').split('/')[0];
      };

      let baFid = 1000;
      const renderBeforeTree = (node, depth) => {
        const keys = Object.keys(node).filter(k => k !== '__item');
        let h = '';
        keys.forEach(key => {
          const child = node[key];
          const isFile = child.__item;
          const indent = depth > 0 ? '<span style="width:'+depth*16+'px;display:inline-block"></span>' : '';
          if (isFile) {
            const item = child.__item;
            const dot = item.issue ? '<span class="ba-dot red" style="margin-right:4px"></span>' : '';
            const fileColor = item.issue ? '#f85149' : 'var(--muted)';
            const moveTarget = item.moveTo || '';
            const moveColor = getMoveColor(moveTarget);
            const moveLayer = getMoveLayer(moveTarget);
            const moveTag = moveTarget ? '<span class="before-move-tag" style="background:'+moveColor+'20;color:'+moveColor+'"><i class="mdi mdi-arrow-right" style="font-size:11px"></i> '+moveLayer+'/</span>' : '';
            const dataMove = moveTarget ? ' data-move-to="'+esc(moveTarget)+'"' : '';
            h += '<div class="tree-item"><div class="tree-item-inner before-file"'+dataMove+' onclick="highlightMove(this)"><div class="tree-indent">'+indent+'</div>'+dot+'<span class="tree-file-icon">'+getFileIcon(key)+'</span><span class="tree-filename" style="color:'+fileColor+'">'+esc(key)+'</span>'+moveTag+'</div></div>';
          } else {
            const id = 'ba-before-'+(baFid++);
            const hasIssue = JSON.stringify(child).includes('"issue":true');
            const folderColor = hasIssue ? '#f85149' : '#58a6ff';
            const dot = hasIssue ? '<span class="ba-dot red" style="margin-right:4px"></span>' : '';
            h += '<div class="tree-item"><div class="tree-item-inner tree-folder-toggle" onclick="toggleFolder(\''+id+'\')" style="cursor:pointer"><div class="tree-indent">'+indent+'</div>'+dot+'<span class="tree-file-icon"><i class="mdi mdi-folder-open" id="'+id+'-icon" style="font-size:16px;color:'+folderColor+'"></i></span><span class="tree-filename" style="color:'+folderColor+';opacity:.7">'+esc(key)+'/</span></div><div id="'+id+'" class="tree-folder-children">'+renderBeforeTree(child, depth+1)+'</div></div>';
          }
        });
        return h;
      };

      // Before HTML을 전역에 저장 (FSD 트리와 합칠 때 사용)
      window._beforeTreeHtml = '<div class="before-panel" style="border:1px solid var(--border);border-radius:10px;overflow:hidden"><div class="before-title"><i class="mdi mdi-folder-search" style="font-size:16px;color:var(--muted)"></i> 현재 구조 <span style="opacity:.5;font-weight:400;font-size:11px">(🔴 문제 · 클릭→이동 경로)</span></div><div class="tree-body open" style="padding:8px 12px;max-height:600px;overflow-y:auto">' + renderBeforeTree(buildBeforeTree(PLAN.beforeAfter.before), 0) + '</div></div>';
    }

    const vizEl = document.createElement('div');
    vizEl.innerHTML = html;
    targetH2.after(vizEl);
  })();

  // FSD 파일트리 (첫 번째 테이블 교체)
  (function () {
    if (!PLAN.layers) return;
    const body = document.getElementById('plan-body');
    if (!body) return;
    const table = body.querySelector('table');
    if (!table) return;

    // getFileIcon은 전역 함수 사용

    const buildTree = (files) => { const root = {}; files.forEach(f => { const parts = f.path.replace('src/','').split('/'); let node = root; parts.forEach((p, i) => { if (!node[p]) node[p] = i === parts.length - 1 ? { __file: f } : {}; node = node[p]; }); }); return root; };
    let fid = 0;
    const renderTree = (node, depth, color) => {
      const keys = Object.keys(node).filter(k => k !== '__file');
      let h = '';
      keys.forEach(key => {
        const child = node[key]; const isFile = child.__file;
        const indent = depth > 0 ? '<span style="width:'+depth*16+'px;display:inline-block"></span>' : '';
        if (isFile) {
          const f = child.__file;
          const fsdPath = f.path.replace('src/','');
          h += '<div class="tree-item"><div class="tree-item-inner" data-fsd-path="'+esc(fsdPath)+'"><div class="tree-indent">'+indent+'</div><span class="tree-file-icon">'+getFileIcon(key)+'</span><span class="tree-filename" style="color:'+color+'">'+esc(key)+'</span><span class="tree-tag '+f.type+'">'+f.type+'</span><span class="tree-desc">'+esc(f.desc)+'</span></div></div>';
        } else {
          const id = 'folder-'+(fid++);
          h += '<div class="tree-item"><div class="tree-item-inner tree-folder-toggle" onclick="toggleFolder(\''+id+'\')" style="cursor:pointer"><div class="tree-indent">'+indent+'</div><span class="tree-file-icon"><i class="mdi mdi-folder-open" id="'+id+'-icon" style="font-size:16px;color:#58a6ff"></i></span><span class="tree-filename" style="color:'+color+';opacity:.7">'+esc(key)+'/</span></div><div id="'+id+'" class="tree-folder-children">'+renderTree(child, depth+1, color)+'</div></div>';
        }
      });
      return h;
    };

    let viz = '';
    // 좌우 배치 아닐 때만 플로우 바 표시
    if (!window._beforeTreeHtml) {
      viz += '<div class="fsd-flow">';
      PLAN.layers.sort((a,b) => a.order - b.order).forEach((l, i) => {
        if (i > 0) viz += '<span class="fsd-flow-arrow">→</span>';
        viz += '<div class="fsd-flow-step" style="background:'+l.bg+';color:'+l.color+';border-color:'+l.color+'40">'+l.label+'<span class="count">'+l.files.length+' files</span></div>';
      });
      viz += '</div>';
    }
    let finalHtml = '';
    if (window._beforeTreeHtml) {
      // 좌우 배치: FSD도 왼쪽과 동일한 단순 폴더 트리 스타일
      let fsdTreeHtml = '';
      PLAN.layers.sort((a,b) => a.order - b.order).forEach(l => {
        // 레이어 이름을 제거한 하위 경로로 트리 생성
        const subFiles = l.files.map(f => ({ ...f, path: f.path.replace('src/' + l.name + '/', '') }));
        const buildSubTree = (files) => { const root = {}; files.forEach(f => { const parts = f.path.split('/'); let node = root; parts.forEach((p, i) => { if (!node[p]) node[p] = i === parts.length - 1 ? { __file: { ...f, path: l.files.find(o => o.path.endsWith(f.path)).path } } : {}; node = node[p]; }); }); return root; };
        const subtree = buildSubTree(subFiles);
        const layerFolderId = 'fsd-layer-' + l.name;
        fsdTreeHtml += '<div class="tree-item"><div class="tree-item-inner tree-folder-toggle" onclick="toggleFolder(\'' + layerFolderId + '\')" style="cursor:pointer"><span class="tree-file-icon"><i class="mdi mdi-folder-open" id="' + layerFolderId + '-icon" style="font-size:16px;color:' + l.color + '"></i></span><span class="tree-filename" style="color:' + l.color + ';opacity:.8;font-weight:600">' + l.name + '/</span></div><div id="' + layerFolderId + '" class="tree-folder-children">' + renderTree(subtree, 1, l.color) + '</div></div>';
      });

      finalHtml = '<div class="migrate-columns">';
      finalHtml += '<div>' + window._beforeTreeHtml + '</div>';
      finalHtml += '<div class="before-panel" style="border:1px solid var(--border);border-radius:10px;overflow:hidden"><div class="before-title" style="background:var(--good-weak);color:var(--good)"><i class="mdi mdi-check-circle" style="font-size:16px"></i> FSD 구조</div><div class="tree-body open" style="padding:8px 12px;max-height:600px;overflow-y:auto">' + fsdTreeHtml + '</div></div>';
      finalHtml += '</div>';
    } else {
      // 단독: 기존 레이어 트리 스타일
      PLAN.layers.sort((a,b) => a.order - b.order).forEach(l => {
        const tree = buildTree(l.files);
        viz += '<div class="layer-tree"><div class="layer-tree-head" style="background:'+l.bg+'" onclick="this.querySelector(\'.arrow-icon\').classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span class="tree-file-icon"><i class="mdi mdi-folder-open" style="font-size:18px"></i></span><span class="layer-name" style="color:'+l.color+'">'+l.name+'/</span><span class="layer-desc" style="color:'+l.color+'">'+l.desc+'</span><span class="file-count" style="color:'+l.color+'">'+l.files.length+'개</span><span class="arrow-icon open" style="color:'+l.color+'">▶</span></div><div class="tree-body open">'+renderTree(tree, 0, l.color)+'</div></div>';
      });
      finalHtml = viz;
    }
    const ve = document.createElement('div'); ve.innerHTML = finalHtml; table.replaceWith(ve);
  })();

  // 타임라인 (작업 순서)
  (function () {
    if (!PLAN.steps) return;
    const body = document.getElementById('plan-body');
    if (!body) return;
    let targetH2 = null;
    body.querySelectorAll('h2').forEach(h => { if (h.textContent.includes('작업 순서')) targetH2 = h; });
    if (!targetH2) return;
    const toRemove = []; let el2 = targetH2.nextElementSibling;
    while (el2 && el2.tagName !== 'H2') { toRemove.push(el2); el2 = el2.nextElementSibling; }
    toRemove.forEach(e => e.remove());
    let h = '<div class="timeline">';
    PLAN.steps.forEach(s => {
      h += '<div class="tl-step"><div class="tl-dot">'+s.step+'</div><div class="tl-card"><div class="tl-head"><span class="tl-layer">'+s.layer+'</span><span class="tl-title">'+s.title+'</span></div><ul class="tl-tasks">'+s.tasks.map(t => '<li>'+esc(t)+'</li>').join('')+'</ul><div class="tl-done"><i class="mdi mdi-check-circle-outline" style="font-size:14px"></i> '+esc(s.done)+'</div></div></div>';
    });
    h += '</div>';
    const ve = document.createElement('div'); ve.innerHTML = h; targetH2.after(ve);
  })();

  function copy(text) { navigator.clipboard.writeText(text).then(showToast).catch(() => { const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); showToast(); }); }
  let tt; function showToast() { const t=document.getElementById('toast'); t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }
  document.getElementById('btn-copy').addEventListener('click', () => copy(buildPrompt()));
  document.getElementById('btn-json').addEventListener('click', () => copy(buildJson()));
  document.getElementById('notes').addEventListener('input', render);
  render(); applyLifecycle();
})();
</script>
</body>
</html>
