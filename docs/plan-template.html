<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>작업계획서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7/css/materialdesignicons.min.css" />
<!--
  FSD Agent Team — 작업계획서 템플릿 (단일 소스)

  이 파일을 직접 복사·치환하지 마세요. 반드시 빌더로 생성합니다:
      python3 scripts/build-plan-html.py <md경로> --data plan.json
      python3 scripts/build-plan-html.py <html경로> --verify-only

  PLAN 데이터 스키마와 레이어 색상 팔레트는 docs/plan-template.md 참고.
  아래 두 스크립트 블록에는 빌더가 채우는 센티넬 라인이 들어있습니다.
-->
<script id="plan-data">
/*@@PLAN_JSON@@*/
</script>

<script id="plan-md" type="text/markdown">
@@PLAN_MD@@
</script>

<style>
  :root {
    --bg: #0f1117;
    --surface: #161b22;
    --border: #2d333b;
    --text: #e1e4e8;
    --muted: #8b949e;
    --primary: #58a6ff;
    --primary-weak: #1c2d44;
    --primary-border: #264a78;
    --good: #3fb950;
    --good-weak: #1a3028;
    --good-border: #26633a;
    --warn: #d29922;
    --warn-weak: #2a2218;
    --warn-border: #6e5a30;
    --bad: #f85149;
    --bad-weak: #3d1f1f;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 1px 2px rgba(0, 0, 0, .2);
    --mono: 'SF Mono', Menlo, Consolas, monospace;
    /* 페이지 폭. 파일 트리·2컬럼 비교 뷰·전수 표가 넓은 폭을 필요로 한다.
       본문 산문만 --prose-w 로 따로 좁혀서 가독성을 지킨다. */
    --page-w: 1400px;
    --prose-w: 82ch;
    /* 2컬럼 비교 뷰(before/after 트리)의 스크롤 높이.
       파일 수가 많은 전수 계획서에서 560px 고정은 너무 낮았다.
       화면 높이에 맞춰 늘리고, 아주 큰 모니터에서만 상한이 걸린다. */
    --tree-h: min(80vh, 1200px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo',
      'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--page-w); margin: 0 auto; padding: 32px 24px 200px; }

  /* 헤더 */
  header.plan-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 26px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .plan-head h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
  .plan-summary { color: var(--muted); margin: 8px 0 16px; font-size: 15px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--primary-weak); color: var(--primary); border: 1px solid var(--primary-border); }
  .badge.type-feature { background:#1c2d44; color:#58a6ff; border-color:#264a78; }
  .badge.type-bugfix { background:var(--bad-weak); color:var(--bad); border-color:#6e3630; }
  .badge.type-refactor { background:#2d1f40; color:#a371f7; border-color:#4a3570; }
  .badge.type-migrate { background:#3d351f; color:var(--warn); border-color:var(--warn-border); }
  .badge.scope { background:#1c2128; color:var(--muted); border-color:var(--border); }
  .md-link { display:inline-block; margin-top:14px; font-size:13px; color:var(--muted); text-decoration:none; }
  .md-link:hover { color: var(--primary); text-decoration: underline; }
  .md-link code { background:#1c2128; padding:2px 6px; border-radius:6px; font-size:12px; }

  /* 상태 배너 */
  .statusbar { display:flex; align-items:center; gap:10px; border-radius: var(--radius); padding: 12px 18px; margin: 24px 0; font-size: 14px; font-weight: 600; border: 1px solid var(--border); }
  .statusbar.pending { background:var(--warn-weak); border-color:var(--warn-border); color:var(--warn); }
  .statusbar.confirmed { background:var(--good-weak); border-color:var(--good-border); color:var(--good); }
  .statusbar .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .statusbar.pending .dot { background:var(--warn); }
  .statusbar.confirmed .dot { background:var(--good); }

  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 12px 2px; }

  /* 결정 카드 */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card.unresolved { border-color: var(--warn-border); }
  .card.confirmed { border-color: var(--good-border); background: #1a2820; }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card-title { font-size: 16px; font-weight: 700; margin: 0; }
  .card-desc { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
  .pick-tag { font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; border:1px solid var(--border); border-radius:999px; padding:2px 9px; }
  .pick-tag.done { color:var(--good); border-color:var(--good-border); background:var(--good-weak); }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .12s, background .12s; background: var(--surface); }
  .option:hover { border-color: #484f58; background: #1c2128; }
  .option.selected { border-color: var(--primary); background: var(--primary-weak); }
  .option .marker { flex: none; width: 20px; height: 20px; margin-top: 1px; border: 2px solid #484f58; background:var(--surface); display:grid; place-items:center; }
  .option[data-type="single"] .marker { border-radius: 50%; }
  .option[data-type="multi"] .marker { border-radius: 6px; }
  .option.selected .marker { border-color: var(--primary); background: var(--primary); }
  .option.selected .marker::after { content: ''; width: 8px; height: 8px; background:#fff; border-radius:2px; }
  .option[data-type="single"].selected .marker::after { border-radius: 50%; }
  .option .opt-body { flex: 1; }
  .opt-label { font-weight: 600; font-size: 14.5px; }
  .opt-label .rec { font-size:11px; font-weight:700; color:var(--good); margin-left:6px; background:var(--good-weak); border:1px solid var(--good-border); padding:1px 7px; border-radius:999px; }
  .opt-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .custom-input { margin-top: 8px; width: 100%; background:#0d1117; color:var(--text); border:1.5px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; display:none; }
  .option.selected .custom-input { display:block; }
  .opt-colors { display: flex; gap: 4px; margin-top: 8px; }
  .opt-color-chip { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,.12); flex-shrink: 0; }
  /* 확정(locked): 선택된 것만 강조, 나머지 흐리게, 클릭 비활성 */
  .card.confirmed .options, .card.confirmed .option { cursor: default; }
  .card.confirmed .option:hover { border-color: var(--border); background: var(--surface); }
  .card.confirmed .option.selected { border-color: var(--good-border); background: var(--good-weak); }
  .card.confirmed .option.selected .marker { border-color: var(--good); background: var(--good); }
  .card.confirmed .option:not(.selected) { opacity: .45; }
  .notes-area { width:100%; background:#0d1117; color:var(--text); min-height:70px; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; font-size:14px; font-family:inherit; resize:vertical; }

  /* 계획서 본문(.md 렌더) */
  .plan-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; box-shadow: var(--shadow); margin-top: 8px; }
  .plan-body h1,.plan-body h2,.plan-body h3,.plan-body h4,.plan-body h5,.plan-body h6 { line-height: 1.3; letter-spacing: -.01em; margin: 1.4em 0 .5em; }
  .plan-body > :first-child { margin-top: 0; }
  .plan-body h1 { font-size: 22px; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
  .plan-body h2 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .plan-body h3 { font-size: 16.5px; }
  .plan-body h4 { font-size: 15px; color: #adbac7; }
  .plan-body p { margin: .6em 0; font-size: 14.5px; max-width: var(--prose-w); }
  .plan-body ul,.plan-body ol { margin: .5em 0; padding-left: 1.4em; font-size: 14.5px; max-width: var(--prose-w); }
  .plan-body li { margin: .25em 0; }
  .plan-body strong { font-weight: 700; color: var(--text); }
  .plan-body code { background: #1c2128; color: #f78166; padding: 1.5px 6px; border-radius: 6px; font-size: 12.8px; font-family: var(--mono); }
  .plan-body pre.md-code { background: #0d1117; border: 1px solid var(--border); color: #e2e8f0; border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: .8em 0; }
  .plan-body pre.md-code code { background: none; color: inherit; padding: 0; font-size: 12.8px; }
  .plan-body blockquote { margin: .8em 0; padding: 8px 16px; border-left: 4px solid var(--primary-border); background: var(--primary-weak); color: #adbac7; border-radius: 0 8px 8px 0; font-size: 14px; max-width: var(--prose-w); }
  .plan-body blockquote p,.plan-body blockquote ul,.plan-body blockquote ol { max-width: none; }
  .plan-body a { color: var(--primary); text-decoration: none; }
  .plan-body a:hover { text-decoration: underline; }
  .plan-body table { border-collapse: collapse; width: 100%; margin: .9em 0; font-size: 13.5px; display: block; overflow-x: auto; }
  .plan-body th,.plan-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; vertical-align: top; }
  .plan-body th { background: #1c2128; font-weight: 700; white-space: nowrap; color: var(--muted); }
  .plan-body tbody tr:nth-child(even) { background: #0d1117; }
  .plan-body hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }

  /* FSD 레이어 플로우 */
  .fsd-flow { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px 0 20px; flex-wrap: wrap; }
  .fsd-flow-step { padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: monospace; border: 2px solid; text-align: center; min-width: 90px; }
  .fsd-flow-step .count { font-size: 11px; font-weight: 400; opacity: .7; display: block; margin-top: 2px; }
  .fsd-flow-arrow { color: var(--muted); font-size: 18px; }

  /* 파일트리 */
  .layer-tree { margin-bottom: 10px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  .layer-tree-head { padding: 10px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .layer-tree-head:hover { filter: brightness(1.08); }
  .layer-tree-head .layer-name { font-size: 13.5px; font-weight: 700; font-family: monospace; }
  .layer-tree-head .layer-desc { font-size: 12px; opacity: .65; margin-left: 4px; }
  .layer-tree-head .file-count { font-size: 11px; font-weight: 600; opacity: .5; margin-left: auto; }
  .layer-tree-head .arrow-icon { transition: transform .15s; font-size: 10px; opacity: .5; }
  .layer-tree-head .arrow-icon.open { transform: rotate(90deg); }
  .tree-body { display: none; background: #1c2128; padding: 8px 12px; }
  .tree-body.open { display: block; }
  .tree-item-inner { display: flex; align-items: center; padding: 5px 12px 5px 4px; font-size: 13px; border-radius: 6px; }
  .tree-indent { display: flex; align-items: center; flex-shrink: 0; }
  .tree-file-icon { font-size: 13px; margin-right: 6px; flex-shrink: 0; display: flex; align-items: center; }
  .tree-filename { font-family: var(--mono); font-size: 12.5px; font-weight: 500; }
  .tree-tag { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 8px; flex-shrink: 0; }
  .tree-tag.CREATE { background: var(--good-weak); color: var(--good); }
  .tree-tag.MODIFY { background: var(--warn-weak); color: var(--warn); }
  .tree-tag.DELETE { background: var(--bad-weak); color: var(--bad); }
  .tree-tag.MOVE { background: #2d1f40; color: #a371f7; }
  .tree-desc { font-size: 12px; color: var(--muted); margin-left: auto; padding-left: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
  .tree-folder-toggle:hover { background: rgba(255,255,255,.03); border-radius: 4px; }
  .tree-folder-children.collapsed { display: none; }
  @media(max-width:600px) { .tree-desc { display: none; } }

  /* 타임라인 */
  .timeline { position: relative; padding-left: 28px; margin: 16px 0; }
  .timeline::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--border); border-radius: 1px; }
  .tl-step { position: relative; margin-bottom: 20px; }
  .tl-step:last-child { margin-bottom: 0; }
  .tl-dot { position: absolute; left: -28px; top: 0; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--text); background: #30363d; z-index: 1; }
  .tl-card { border-radius: 10px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); }
  .tl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tl-layer { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; font-family: monospace; background: #1c2128; color: var(--muted); }
  .tl-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .tl-tasks { list-style: none; padding: 0; margin: 0; }
  .tl-tasks li { font-size: 13px; color: var(--muted); padding: 3px 0; display: flex; align-items: flex-start; gap: 6px; }
  .tl-tasks li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #484f58; flex-shrink: 0; margin-top: 7px; }
  .tl-done { margin-top: 10px; font-size: 12px; padding: 6px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; background: var(--good-weak); color: var(--good); }

  /* 디자인 시스템 */
  .design-section { margin: 4px 0 20px; }
  .design-source { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px; }
  .design-source.existing { background: var(--good-weak); color: var(--good); border: 1px solid var(--good-border); }
  .design-source.new { background: var(--primary-weak); color: var(--primary); border: 1px solid var(--primary-border); }
  .design-source.generated { background: #2d1f40; color: #a371f7; border: 1px solid #4a3570; }
  .design-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px 2px; }
  .design-label:first-of-type { margin-top: 4px; }
  .color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .color-swatch { width: 100px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); transition: transform .1s; }
  .color-swatch:hover { transform: translateY(-2px); }
  .swatch-color { height: 52px; }
  .swatch-info { padding: 7px 9px; }
  .swatch-name { font-size: 11px; font-weight: 600; color: var(--text); display: block; margin-bottom: 1px; }
  .swatch-value { font-size: 10px; color: var(--muted); font-family: var(--mono); }
  .swatch-desc { font-size: 10px; color: var(--muted); display: block; margin-top: 2px; }
  .typo-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .typo-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .typo-row:last-child { border-bottom: none; }
  .typo-role { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; min-width: 64px; letter-spacing: .03em; }
  .typo-sample { flex: 1; color: var(--text); }
  .typo-meta { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .token-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .token-name { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .token-value { font-size: 12px; font-family: var(--mono); font-weight: 600; color: var(--text); }
  .design-notes { margin-top: 14px; font-size: 13px; color: var(--muted); font-style: italic; padding: 10px 14px; background: #1c2128; border-radius: 8px; border-left: 3px solid var(--primary); }

  /* 구현 체크리스트 (design.checklist) — 구체 수치가 코드까지 전달되는 경로 */
  .impl-checklist { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--warn-border); border-radius: 10px; background: var(--warn-weak); padding: 12px 14px; }
  .impl-checklist-note { font-size: 11px; color: var(--warn); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .impl-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text); }
  .impl-item .box { flex: none; width: 14px; height: 14px; margin-top: 3px; border: 2px solid var(--warn); border-radius: 3px; }

  /* 규칙 테이블 (uxRules / motion / stackGuides) */
  .rule-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .rule-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; }
  .rule-row:last-child { border-bottom: none; }
  .rule-cat { font-size: 11px; font-weight: 700; font-family: monospace; color: var(--muted); min-width: 96px; flex-shrink: 0; padding-top: 2px; }
  .rule-body { flex: 1; min-width: 0; }
  .rule-main { color: var(--text); }
  .rule-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rule-sub .do { color: var(--good); }
  .rule-sub .dont { color: var(--bad); }
  .sev { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0; }
  .sev.Critical, .sev.critical { background: var(--bad-weak); color: var(--bad); }
  .sev.High, .sev.high { background: var(--warn-weak); color: var(--warn); }
  .sev.Medium, .sev.medium { background: var(--primary-weak); color: var(--primary); }
  .sev.Low, .sev.low { background: #1c2128; color: var(--muted); }

  /* 문제 분석 (migrate) */
  .issue-summary { display: flex; gap: 8px; margin: 12px 0 14px; flex-wrap: wrap; }
  .issue-count { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .issue-count.critical { background: var(--bad-weak); color: var(--bad); }
  .issue-count.warning { background: var(--warn-weak); color: var(--warn); }
  .issue-count.info { background: var(--primary-weak); color: var(--primary); }
  .issue-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .issue-card.critical { border-left: 3px solid var(--bad); }
  .issue-card.warning { border-left: 3px solid var(--warn); }
  .issue-card.info { border-left: 3px solid var(--primary); }
  .issue-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .issue-severity { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .issue-severity.critical { background: var(--bad-weak); color: var(--bad); }
  .issue-severity.warning { background: var(--warn-weak); color: var(--warn); }
  .issue-severity.info { background: var(--primary-weak); color: var(--primary); }
  .issue-category { font-size: 12px; color: var(--muted); font-weight: 600; }
  .issue-file { font-family: var(--mono); font-size: 12px; color: var(--primary); word-break: break-all; }
  .issue-lines { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .issue-desc { font-size: 13px; color: var(--muted); margin: 4px 0; }
  .issue-suggestion { font-size: 12.5px; color: var(--good); display: flex; align-items: flex-start; gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1c2128; }

  /* Before → After (migrate) */
  .ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  @media(max-width:700px) { .ba-grid { grid-template-columns: 1fr; } }
  .ba-panel { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .ba-title { padding: 10px 14px; font-size: 12px; font-weight: 700; background: #1c2128; display: flex; align-items: center; gap: 6px; }
  .ba-title.before { color: var(--muted); }
  .ba-title.after { color: var(--good); }
  .ba-tree { padding: 8px 6px; max-height: var(--tree-h); overflow-y: auto; background: #1c2128; resize: vertical; }
  .ba-tree .tree-item-inner { padding: 4px 8px 4px 4px; }
  .ba-tree .tree-filename { font-size: 12px; }
  .ba-tree .file-count { font-size: 10px; font-weight: 600; opacity: .5; margin-left: auto; }
  .ba-tree .layer-desc { font-size: 11px; opacity: .6; margin-left: 8px; }
  .ba-count { font-family: var(--mono); font-size: 10px; font-weight: 700; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 999px; margin: 0 6px 0 2px; }
  .ba-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex-shrink: 0; margin-left: 6px; }
  /* 병합되어 사라지는 파일 — 단순 이동과 반드시 구분되어야 한다 */
  .tree-filename.merged { text-decoration: line-through; text-decoration-color: #a371f7; opacity: .7; }
  .ba-merge-tag { font-size: 10px; font-weight: 700; font-family: var(--mono); background: #2d1f40; color: #a371f7; border: 1px solid #4a3570; padding: 1px 6px; border-radius: 4px; margin-left: 8px; flex-shrink: 0; }
  .ba-lines { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--warn); background: var(--warn-weak); padding: 1px 5px; border-radius: 3px; margin-left: 8px; flex-shrink: 0; }
  /* 좌측 before 행: 클릭 대상. 이동 경로 배지는 hover/선택 시에만 드러낸다 */
  .before-file { cursor: pointer; transition: background .12s; border-radius: 4px; }
  .before-file:hover { background: rgba(255,255,255,.04); }
  .before-file.active { background: rgba(88,166,255,.12); }
  .before-move-tags { display: flex; gap: 4px; margin-left: auto; padding-left: 8px; flex-shrink: 0; }
  .before-move-tag { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; opacity: 0; transition: opacity .15s; }
  .before-file:hover .before-move-tag, .before-file.active .before-move-tag { opacity: 1; }
  /* 우측 FSD 행: 클릭된 before 파일의 목적지 */
  .fsd-highlight { border-radius: 4px; animation: fsdPulse .6s ease 5; }
  @keyframes fsdPulse {
    0%, 100% { background: transparent; }
    50% { background: rgba(88,166,255,.28); }
  }

  /* 하단 고정 액션 바 */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13,17,23,.92); backdrop-filter: blur(8px); border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(0,0,0,.3); padding: 14px 20px; }
  .actionbar-inner { max-width: var(--page-w); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .status { font-size: 13px; color: var(--muted); flex: 1; }
  .status b { color: var(--text); }
  button { font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 9px; padding: 11px 18px; border: 1px solid var(--border); background: #21262d; color: var(--text); transition: filter .12s, background .12s; }
  button:hover { background: #30363d; }
  button.primary { background: #238636; color:#fff; border-color: #238636; }
  button.primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  details.preview { margin: 8px 0 24px; }
  details.preview summary { cursor:pointer; font-size:13px; color:var(--muted); padding:6px 0; }
  pre.prompt-out { background:#0d1117; border:1px solid var(--border); color:#e2e8f0; border-radius:10px; padding:16px 18px; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word; font-family: var(--mono); margin: 4px 0 0; }
  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--good); color:#fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow); z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="plan-head">
    <h1 id="p-title"></h1>
    <p class="plan-summary" id="p-summary"></p>
    <div class="badges">
      <span class="badge" id="p-type"></span>
      <span class="badge scope" id="p-scope"></span>
    </div>
    <a class="md-link" id="p-mdlink" href="#"></a>
  </header>

  <p class="section-title" id="body-title" style="display:none">작업계획서 상세</p>
  <article class="plan-body" id="plan-body" style="display:none"></article>

  <div class="statusbar" id="statusbar"><span class="dot"></span><span id="statusbar-text"></span></div>

  <div id="decisions-wrap">
    <p class="section-title" id="decisions-title">결정 사항 — 선택 후 하단 [프롬프트로 복사]</p>
    <div id="decisions"></div>

    <div class="card" id="notes-card">
      <h3 class="card-title">추가 메모 (선택)</h3>
      <p class="card-desc">결정 외에 전달할 제약·우선순위·주의사항이 있으면 적어주세요.</p>
      <textarea class="notes-area" id="notes" placeholder="예: 이미지 첨부는 다음 스프린트로"></textarea>
    </div>

    <details class="preview">
      <summary>복사될 프롬프트 미리보기</summary>
      <pre class="prompt-out" id="preview"></pre>
    </details>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="status" id="status"></div>
    <button id="btn-json">JSON 복사</button>
    <button class="primary" id="btn-copy">프롬프트로 복사</button>
  </div>
</div>
<div class="toast" id="toast">복사되었습니다</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 유틸
  const state = {}; // decisionId -> { picks: Set, custom: string }
  const el = (tag, cls, html) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  };
  const esc = (str) => String(str == null ? '' : str)
    .replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const decidedList = (dec) =>
    dec.decided == null ? null : (Array.isArray(dec.decided) ? dec.decided : [dec.decided]);
  const isConfirmed = (dec) => decidedList(dec) !== null;
  const allConfirmed = () => PLAN.decisions.length > 0 &&
    PLAN.decisions.every((dec) => !dec.required || isConfirmed(dec));

  const hexLuminance = (hex) => {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const r = parseInt(h.substr(0, 2), 16) / 255;
    const g = parseInt(h.substr(2, 2), 16) / 255;
    const b = parseInt(h.substr(4, 2), 16) / 255;
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };

  // ---------------------------------------------------------------- 헤더
  document.getElementById('p-title').textContent = PLAN.title;
  document.getElementById('p-summary').textContent = PLAN.summary || '';
  const typeBadge = document.getElementById('p-type');
  typeBadge.textContent = PLAN.type;
  typeBadge.classList.add('type-' + PLAN.type);
  document.getElementById('p-scope').textContent = '범위: ' + PLAN.scope;
  const mdLink = document.getElementById('p-mdlink');
  mdLink.innerHTML = '원본 계획서 → <code>' + esc(PLAN.mdFile) + '</code>';
  mdLink.href = PLAN.mdFile.split('/').pop();

  // ---------------------------------------------------------------- 결정 카드
  const container = document.getElementById('decisions');
  PLAN.decisions.forEach((dec) => {
    const confirmed = isConfirmed(dec);
    const preset = decidedList(dec) || [];
    state[dec.id] = { picks: new Set(preset), custom: '' };

    const card = el('div', 'card' + (confirmed ? ' confirmed' : ''));
    card.dataset.id = dec.id;
    card.appendChild(el('div', 'card-head',
      '<h3 class="card-title">' + esc(dec.title) + (dec.required ? ' *' : '') + '</h3>' +
      '<span class="pick-tag">' + (dec.type === 'multi' ? '복수 선택' : '택1') + '</span>'));
    if (dec.desc) card.appendChild(el('p', 'card-desc', esc(dec.desc)));

    const opts = el('div', 'options');
    dec.options.forEach((opt) => {
      const row = el('div', 'option');
      row.dataset.type = dec.type;
      if (preset.indexOf(opt.label) !== -1) row.classList.add('selected');
      const chips = opt.colors
        ? '<div class="opt-colors">' + opt.colors.map((c) =>
            '<span class="opt-color-chip" style="background:' + esc(c) + '"></span>').join('') + '</div>'
        : '';
      row.innerHTML =
        '<div class="marker"></div>' +
        '<div class="opt-body">' +
          '<div class="opt-label">' + esc(opt.label) +
            (opt.recommended ? '<span class="rec">추천</span>' : '') + '</div>' +
          (opt.desc ? '<div class="opt-desc">' + esc(opt.desc) + '</div>' : '') +
          chips +
          (opt.custom ? '<input class="custom-input" placeholder="직접 입력" />' : '') +
        '</div>';
      if (!confirmed) {
        row.addEventListener('click', (ev) => {
          if (ev.target.classList.contains('custom-input')) return;
          toggle(dec, opt, row, opts);
        });
        const input = row.querySelector('.custom-input');
        if (input) input.addEventListener('input', () => {
          state[dec.id].custom = input.value;
          render();
        });
      }
      opts.appendChild(row);
    });
    card.appendChild(opts);
    container.appendChild(card);
  });

  function toggle(dec, opt, row, opts) {
    const picks = state[dec.id].picks;
    if (dec.type === 'single') {
      picks.clear();
      opts.querySelectorAll('.option').forEach((n) => n.classList.remove('selected'));
      picks.add(opt.label);
      row.classList.add('selected');
    } else if (picks.has(opt.label)) {
      picks.delete(opt.label);
      row.classList.remove('selected');
    } else {
      picks.add(opt.label);
      row.classList.add('selected');
    }
    render();
  }

  // ---------------------------------------------------------------- 프롬프트 생성
  function valueFor(dec) {
    const st = state[dec.id];
    return [...st.picks].map((label) => {
      const opt = dec.options.find((o) => o.label === label);
      return (opt && opt.custom && st.custom.trim()) ? st.custom.trim() : label;
    }).join(', ');
  }
  const unresolved = () =>
    PLAN.decisions.filter((dec) => dec.required && state[dec.id].picks.size === 0);

  function buildPrompt() {
    const lines = [
      '[작업계획서 결정사항 확정] ' + PLAN.title, '',
      '아래 결정사항으로 ' + PLAN.mdFile + ' 계획서를 확정하고 진행해주세요.', '',
    ];
    PLAN.decisions.forEach((dec, i) => {
      lines.push((i + 1) + '. ' + dec.title + ': ' + (valueFor(dec) || '(미결정)'));
    });
    lines.push('', '추가 메모: ' + (document.getElementById('notes').value.trim() || '(없음)'));
    return lines.join('\n');
  }
  function buildJson() {
    const obj = {
      title: PLAN.title, mdFile: PLAN.mdFile, decisions: {},
      notes: document.getElementById('notes').value.trim(),
    };
    PLAN.decisions.forEach((dec) => { obj.decisions[dec.title] = valueFor(dec); });
    return JSON.stringify(obj, null, 2);
  }

  function render() {
    PLAN.decisions.forEach((dec) => {
      const card = container.querySelector('[data-id="' + dec.id + '"]');
      const tag = card.querySelector('.pick-tag');
      const decided = state[dec.id].picks.size > 0;
      card.classList.toggle('unresolved', !!dec.required && !decided && !isConfirmed(dec));
      if (decided) {
        tag.classList.add('done');
        tag.textContent = (isConfirmed(dec) ? '✅ 확정 · ' : '✓ ') + valueFor(dec);
      } else {
        tag.classList.remove('done');
        tag.textContent = dec.type === 'multi' ? '복수 선택' : '택1';
      }
    });
    const left = unresolved();
    const status = document.getElementById('status');
    if (left.length === 0) {
      status.innerHTML = '<b>모든 필수 결정 완료.</b> 복사해서 채팅에 붙여넣으세요.';
    } else {
      status.innerHTML = '필수 결정 <b>' + left.length + '개</b> 남음: ' +
        left.map((dec) => esc(dec.title)).join(', ');
    }
    document.getElementById('btn-copy').disabled = left.length > 0;
    document.getElementById('preview').textContent = buildPrompt();
  }

  function applyLifecycle() {
    const confirmed = allConfirmed();
    const bar = document.getElementById('statusbar');
    const text = document.getElementById('statusbar-text');
    if (confirmed) {
      bar.className = 'statusbar confirmed';
      text.textContent = '✅ 확정 완료 — 이 계획서는 확정되었습니다. (아래 결정 카드는 잠금)';
      document.getElementById('decisions-title').textContent = '확정된 결정 사항';
      document.getElementById('notes-card').style.display = 'none';
      document.querySelector('details.preview').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';
      document.querySelector('.wrap').style.paddingBottom = '60px';
    } else {
      bar.className = 'statusbar pending';
      const left = PLAN.decisions.filter((d) => d.required && !isConfirmed(d)).length;
      text.textContent = '결정 대기 — 필수 ' + left + '건을 선택해 [프롬프트로 복사] 후 채팅에 붙여넣어 주세요.';
    }
  }

  // ---------------------------------------------------------------- md 렌더 (경량, 중첩목록 미지원)
  const body = document.getElementById('plan-body');
  (function renderPlanBody() {
    const raw = (document.getElementById('plan-md').textContent || '').trim();
    if (!raw) return;
    document.getElementById('body-title').style.display = '';
    body.style.display = '';

    const mdEsc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const inline = (s) => mdEsc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    const splitRow = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    const isSpecial = (l) => /^#{1,6}\s/.test(l) || /^```/.test(l) || /^\s*\|.*\|\s*$/.test(l) ||
      /^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l) || /^\s*---+\s*$/.test(l) ||
      /^\s*>/.test(l) || /^\s*$/.test(l);

    const lines = raw.replace(/\r\n/g, '\n').split('\n');
    let html = '', i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        i += 1;
        const buf = [];
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        html += '<pre class="md-code"><code>' + mdEsc(buf.join('\n')) + '</code></pre>';
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const head = splitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i += 1; }
        html += '<table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') +
          '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
        continue;
      }
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const lv = heading[1].length;
        html += '<h' + lv + '>' + inline(heading[2]) + '</h' + lv + '>';
        i += 1;
        continue;
      }
      if (/^\s*---+\s*$/.test(line)) { html += '<hr>'; i += 1; continue; }
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i += 1; }
        html += '<blockquote>' + inline(buf.join(' ')) + '</blockquote>';
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const buf = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')); i += 1;
        }
        const items = buf.map((x) => '<li>' + inline(x) + '</li>').join('');
        html += ordered ? '<ol>' + items + '</ol>' : '<ul>' + items + '</ul>';
        continue;
      }
      if (/^\s*$/.test(line)) { i += 1; continue; }
      const buf = [line];
      i += 1;
      while (i < lines.length && !isSpecial(lines[i])) { buf.push(lines[i]); i += 1; }
      html += '<p>' + inline(buf.join(' ')) + '</p>';
    }
    body.innerHTML = html;
  })();

  // ---------------------------------------------------------------- 섹션 마운트
  // md 본문의 해당 h2 섹션을 시각 컴포넌트로 교체한다.
  // 헤딩을 못 찾으면 본문 끝에 제목과 함께 덧붙인다 (데이터가 조용히 사라지지 않도록).
  const stripSrc = (p) => p.replace(/^src\//, '');

  // keywords 는 구체적인 것부터 나열한다. 앞 키워드를 전체 h2 에서 먼저 찾고,
  // 없을 때만 다음 키워드로 내려간다.
  //
  // h2 를 바깥 루프로 돌면 우선순위가 뒤집힌다. 실제로 ['문제', '현재 상태 분석'] 이
  // '## 2. 현재 상태 분석' 을 먼저 잡아 기준선 표를 덮어쓰고, '## 문제 분석' 에는
  // severity 카드가 안 붙는 사고가 있었다.
  function findSection(keywords) {
    const heads = Array.from(body.querySelectorAll('h2'));
    for (const k of keywords) {
      const hit = heads.find((h) => h.textContent.includes(k));
      if (hit) return hit;
    }
    return null;
  }

  // md 의 해당 섹션(h2 + 다음 h2 까지)을 통째로 걷어낸다.
  // 두 섹션을 하나로 합칠 때 남는 쪽이 고아 제목으로 뜨는 것을 막는다.
  function dropSection(keywords) {
    const target = findSection(keywords);
    if (!target) return;
    let sib = target.nextElementSibling;
    while (sib && sib.tagName !== 'H2') {
      const next = sib.nextElementSibling;
      sib.remove();
      sib = next;
    }
    target.remove();
  }

  function mountSection(keywords, fallbackTitle, html) {
    if (!html || body.style.display === 'none') return;
    const target = findSection(keywords);
    const node = document.createElement('div');
    node.innerHTML = html;
    if (target) {
      let sib = target.nextElementSibling;
      const drop = [];
      while (sib && sib.tagName !== 'H2') { drop.push(sib); sib = sib.nextElementSibling; }
      drop.forEach((n) => n.remove());
      target.after(node);
    } else {
      body.appendChild(el('h2', null, esc(fallbackTitle)));
      body.appendChild(node);
    }
  }

  // ---------------------------------------------------------------- FSD 레이어 배치
  const FILE_ICONS = {
    '.tsx': 'react', '.jsx': 'react', '.ts': 'typescript', '.js': 'javascript',
    '.scss': 'sass', '.css': 'css3', '.json': 'nodejs', '.md': 'markdown',
    '.html': 'html5', '.vue': 'vuejs', '.svelte': 'svelte', '.py': 'python',
  };
  const fileIcon = (name) => {
    const devicon = FILE_ICONS['.' + name.split('.').pop()];
    return devicon
      ? '<i class="devicon-' + devicon + '-plain colored" style="font-size:16px"></i>'
      : '<i class="mdi mdi-file-outline" style="font-size:16px;color:#8b949e"></i>';
  };

  let folderSeq = 0;
  // stripRoot: 레이어 트리는 레이어명이 헤더에 이미 있으므로 `src/` 를 떼고 그린다.
  // Before/After 는 `src/` 와 `app/` 두 뿌리를 구분해서 보여줘야 하므로 떼지 않는다.
  // stripLayer: 레이어명(문자열)을 주면 `src/<레이어>/` 접두사를 함께 걷어낸다.
  // 레이어 헤더가 이미 레이어명을 보여주므로, 안 걷어내면 `shared/ > shared/` 처럼 중복된다.
  function buildTree(files, stripLayer) {
    const root = {};
    files.forEach((f) => {
      let raw = f.path;
      if (stripLayer) {
        raw = raw.replace(/^src\//, '');
        const pre = stripLayer + '/';
        if (raw.startsWith(pre)) raw = raw.slice(pre.length);
      }
      const parts = raw.split('/').filter(Boolean);
      let node = root;
      parts.forEach((part, idx) => {
        if (!node[part]) node[part] = (idx === parts.length - 1) ? { __file: f } : {};
        node = node[part];
      });
    });
    return root;
  }
  // leaf(key, file, color) → 파일 행에서 아이콘 뒤에 붙일 html
  // rowMeta(file) → { cls, attrs } 로 파일 행 자체에 클래스/속성을 더한다 (클릭 대상 지정용)
  function renderTree(node, depth, color, leaf, rowMeta) {
    return Object.keys(node).filter((k) => k !== '__file').map((key) => {
      const child = node[key];
      const indent = depth > 0
        ? '<span style="width:' + (depth * 16) + 'px;display:inline-block"></span>' : '';
      if (child.__file) {
        const meta = rowMeta ? rowMeta(child.__file) : null;
        return '<div class="tree-item">' +
          '<div class="tree-item-inner' + (meta && meta.cls ? ' ' + meta.cls : '') + '"' +
            (meta && meta.attrs ? meta.attrs : '') + '>' +
          '<div class="tree-indent">' + indent + '</div>' +
          '<span class="tree-file-icon">' + fileIcon(key) + '</span>' +
          leaf(key, child.__file, color) +
          '</div></div>';
      }
      const id = 'folder-' + (folderSeq++);
      return '<div class="tree-item">' +
        '<div class="tree-item-inner tree-folder-toggle" data-folder="' + id + '" style="cursor:pointer">' +
          '<div class="tree-indent">' + indent + '</div>' +
          '<span class="tree-file-icon"><i class="mdi mdi-folder-open" data-folder-icon="' + id +
            '" style="font-size:16px;color:#58a6ff"></i></span>' +
          '<span class="tree-filename" style="color:' + esc(color) + ';opacity:.7">' + esc(key) + '/</span>' +
        '</div>' +
        '<div id="' + id + '" class="tree-folder-children">' +
          renderTree(child, depth + 1, color, leaf, rowMeta) + '</div>' +
        '</div>';
    }).join('');
  }

  const layerLeaf = (key, f, color) =>
    '<span class="tree-filename" style="color:' + esc(color) + '">' + esc(key) + '</span>' +
    '<span class="tree-tag ' + esc(f.type) + '">' + esc(f.type) + '</span>' +
    (f.desc ? '<span class="tree-desc">' + esc(f.desc) + '</span>' : '');

  // beforeAfter.before 가 있으면(= migrate) 2컬럼 비교 뷰 하나로 합친다.
  // 별도의 "구조 비교" 섹션을 두면 같은 FSD 트리를 두 번 그리게 된다.
  (function mountStructure() {
    if (!PLAN.layers || !PLAN.layers.length) return;
    const layers = PLAN.layers.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const before = ((PLAN.beforeAfter || {}).before) || [];
    const merged = before.length > 0;

    if (!merged) {
      // ---- feature/refactor: 플로우 바 + 레이어별 파일트리
      let html = '<div class="fsd-flow">';
      layers.forEach((layer, i) => {
        if (i > 0) html += '<span class="fsd-flow-arrow">→</span>';
        html += '<div class="fsd-flow-step" style="background:' + esc(layer.bg) + ';color:' + esc(layer.color) +
          ';border-color:' + esc(layer.color) + '40">' + esc(layer.label) +
          '<span class="count">' + layer.files.length + ' files</span></div>';
      });
      html += '</div>';

      layers.forEach((layer) => {
        html += '<div class="layer-tree">' +
          '<div class="layer-tree-head" style="background:' + esc(layer.bg) + '" data-layer-toggle="1">' +
            '<span class="tree-file-icon"><i class="mdi mdi-folder-open" style="font-size:18px;color:' +
              esc(layer.color) + '"></i></span>' +
            '<span class="layer-name" style="color:' + esc(layer.color) + '">' + esc(layer.name) + '/</span>' +
            '<span class="layer-desc" style="color:' + esc(layer.color) + '">' + esc(layer.desc || '') + '</span>' +
            '<span class="file-count" style="color:' + esc(layer.color) + '">' + layer.files.length + '개</span>' +
            '<span class="arrow-icon open" style="color:' + esc(layer.color) + '">▶</span>' +
          '</div>' +
          '<div class="tree-body open">' +
            renderTree(buildTree(layer.files, layer.name), 0, layer.color, layerLeaf) + '</div>' +
          '</div>';
      });

      mountSection(['FSD 레이어 배치', '레이어 배치', '파일 배치'], 'FSD 레이어 배치', html);
      return;
    }

    // ---- migrate: 현재 구조 | FSD 구조 2컬럼. 플로우 바는 폭을 잡아먹어 넣지 않는다.
    const norm = (item) => (typeof item === 'string' ? { path: item } : item);
    const moveList = (f) => {
      const raw = f.moveTo || f.movesTo;   // movesTo 는 구버전 별칭
      if (!raw) return [];
      return Array.isArray(raw) ? raw : [raw];
    };
    const layerColors = {};
    layers.forEach((l) => { layerColors[l.name] = l.color; });
    const layerOf = (dest) => stripSrc(dest).split('/')[0];

    // 좌: 문제 파일은 빨강. 클릭하면 우측에서 목적지를 하이라이트한다.
    // f.merge 는 "다른 파일로 흡수되어 사라지는 파일" — 단순 이동과 구분해서 그린다.
    const beforeLeaf = (key, f) => {
      const badges = f.merge ? '' : moveList(f).map((d) => {
        const layer = layerOf(d);
        const c = layerColors[layer] || '#58a6ff';
        return '<span class="before-move-tag" style="background:' + esc(c) + '20;color:' + esc(c) + '">' +
          '<i class="mdi mdi-arrow-right" style="font-size:11px"></i> ' + esc(layer) + '/</span>';
      }).join('');
      const mergeTag = f.merge
        ? '<span class="ba-merge-tag" title="이 파일은 사라집니다. 내용은 ' +
          esc(moveList(f)[0] || '') + ' 로 흡수됩니다">병합·삭제</span>'
        : '';
      const nameColor = f.merge ? '#a371f7' : (f.issue ? '#f85149' : 'var(--muted)');
      return '<span class="tree-filename' + (f.merge ? ' merged' : '') +
        '" style="color:' + nameColor + '">' + esc(key) + '</span>' +
        (f.lines ? '<span class="ba-lines">' + esc(f.lines) + '줄</span>' : '') +
        (f.issue && !f.merge ? '<span class="ba-dot" title="문제 파일"></span>' : '') +
        mergeTag +
        (badges ? '<span class="before-move-tags">' + badges + '</span>' : '');
    };
    const beforeRowMeta = (f) => {
      const dests = moveList(f);
      if (!dests.length) return null;
      return {
        cls: 'before-file',
        attrs: ' data-move-to="' + esc(dests.map(stripSrc).join('|')) + '"' +
               ' title="클릭 → 이동 경로 하이라이트"',
      };
    };

    // 우: layers 로 그린다. 그래야 data-fsd-path 가 moveTo 와 정확히 맞물린다.
    const fsdRowMeta = (f) => ({ cls: '', attrs: ' data-fsd-path="' + esc(stripSrc(f.path)) + '"' });
    let fsdTree = '';
    layers.forEach((l) => {
      const id = 'fsd-layer-' + l.name;
      fsdTree += '<div class="tree-item">' +
        '<div class="tree-item-inner tree-folder-toggle" data-folder="' + id + '" style="cursor:pointer">' +
          '<span class="tree-file-icon"><i class="mdi mdi-folder-open" data-folder-icon="' + id +
            '" style="font-size:16px;color:' + esc(l.color) + '"></i></span>' +
          '<span class="tree-filename" style="color:' + esc(l.color) +
            ';opacity:.85;font-weight:600">' + esc(l.name) + '/</span>' +
          '<span class="layer-desc" style="color:' + esc(l.color) + '">' + esc(l.desc || '') + '</span>' +
          '<span class="file-count" style="color:' + esc(l.color) + '">' + l.files.length + '개</span>' +
        '</div>' +
        '<div id="' + id + '" class="tree-folder-children">' +
          renderTree(buildTree(l.files, l.name), 1, l.color, layerLeaf, fsdRowMeta) +
        '</div></div>';
    });

    const panel = (cls, icon, title, inner) =>
      '<div class="ba-panel"><div class="ba-title ' + cls + '">' +
      '<i class="mdi ' + icon + '" style="font-size:16px"></i> ' + title + '</div>' +
      '<div class="ba-tree">' + inner + '</div></div>';

    const mergeCount = before.filter((f) => f.merge).length;
    const beforeLegend = '<span style="opacity:.5;font-weight:400;font-size:11px">🔴 문제 · 클릭→이동 경로</span>' +
      (mergeCount
        ? '<span class="ba-merge-tag" style="margin-left:4px">병합·삭제 ' + mergeCount + '</span>'
        : '');

    // 두 패널은 서로 다른 것을 센다. 좌=마이그레이션 전 원본 파일,
    // 우=마이그레이션 후 항목(신규 index.ts 포함). 그대로 두면 숫자를 빼보고 안 맞아 혼란스럽다.
    const tally = (t) => layers.reduce(
      (n, l) => n + l.files.filter((f) => (f.type || 'MOVE') === t).length, 0);
    const afterTotal = layers.reduce((n, l) => n + l.files.length, 0);
    const parts = [['MOVE', '이동'], ['CREATE', '신규'], ['MODIFY', '유지']]
      .map(([t, ko]) => [ko, tally(t)]).filter(([, n]) => n > 0)
      .map(([ko, n]) => ko + ' ' + n).join(' · ');
    const afterNote = parts
      ? '<span style="opacity:.5;font-weight:400;font-size:11px">' + parts + '</span>' : '';

    const html = '<div class="ba-grid" id="ba-compare">' +
      panel('before', 'mdi-folder-search',
        '현재 구조 <span class="ba-count">' + before.length + '</span>' + beforeLegend,
        renderTree(buildTree(before.map(norm), null), 0, '#8b949e', beforeLeaf, beforeRowMeta)) +
      panel('after', 'mdi-folder-check',
        'FSD 구조 <span class="ba-count">' + afterTotal + '</span>' + afterNote, fsdTree) +
      '</div>';

    // 합친 뷰는 레이어 배치 섹션이 담는다. 남아 있는 "구조 비교" 섹션은 걷어낸다.
    dropSection(['구조 비교', 'Before']);
    mountSection(['FSD 레이어 배치', '레이어 배치', '파일 배치'], 'FSD 레이어 배치', html);
  })();

  // ---------------------------------------------------------------- 작업 순서 타임라인
  (function mountSteps() {
    if (!PLAN.steps || !PLAN.steps.length) return;
    let html = '<div class="timeline">';
    PLAN.steps.forEach((s, idx) => {
      html += '<div class="tl-step">' +
        '<div class="tl-dot">' + esc(s.step != null ? s.step : idx + 1) + '</div>' +
        '<div class="tl-card">' +
          '<div class="tl-head">' +
            '<span class="tl-layer">' + esc(s.layer || '') + '</span>' +
            '<span class="tl-title">' + esc(s.title || '') + '</span>' +
          '</div>' +
          '<ul class="tl-tasks">' + (s.tasks || []).map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
          (s.done ? '<div class="tl-done"><i class="mdi mdi-check-circle-outline" style="font-size:14px"></i> ' +
            esc(s.done) + '</div>' : '') +
        '</div></div>';
    });
    html += '</div>';
    mountSection(['작업 순서', '작업 단계', '타임라인'], '작업 순서', html);
  })();

  // ---------------------------------------------------------------- 디자인 시스템
  (function mountDesign() {
    const d = PLAN.design;
    if (!d) return;
    let html = '<div class="design-section">';

    if (d.source === 'existing') {
      html += '<div class="design-source existing"><i class="mdi mdi-check-circle" style="font-size:14px"></i> ' +
        esc(d.sourceFile || '기존 디자인 시스템') + ' 에서 추출</div>';
    } else if (d.source === 'generated') {
      html += '<div class="design-source generated"><i class="mdi mdi-auto-fix" style="font-size:14px"></i> ' +
        esc(d.generator || 'ui-ux-pro-max') + ' 생성' + (d.category ? ' — ' + esc(d.category) : '') + '</div>';
    } else {
      html += '<div class="design-source new"><i class="mdi mdi-palette" style="font-size:14px"></i> 새 디자인 시스템</div>';
    }

    if (d.colors && d.colors.length) {
      html += '<div class="design-label">Colors</div><div class="color-grid">';
      d.colors.forEach((c) => {
        html += '<div class="color-swatch">' +
          '<div class="swatch-color" style="background:' + esc(c.value) + '"></div>' +
          '<div class="swatch-info">' +
            '<span class="swatch-name">' + esc(c.name) + '</span>' +
            '<span class="swatch-value">' + esc(c.value) + '</span>' +
            (c.desc ? '<span class="swatch-desc">' + esc(c.desc) + '</span>' : '') +
          '</div></div>';
      });
      html += '</div>';
    }

    if (d.typography) {
      html += '<div class="design-label">Typography</div><div class="typo-list">';
      Object.keys(d.typography).forEach((role) => {
        const t = d.typography[role];
        const size = role === 'heading' ? '20px' : (role === 'mono' ? '14px' : '15px');
        const sample = d.sampleText || '다람쥐 헌 쳇바퀴에 타고파 Aa Bb 0123';
        html += '<div class="typo-row">' +
          '<span class="typo-role">' + esc(role) + '</span>' +
          '<span class="typo-sample" style="font-family:' + esc(t.family) + ';font-weight:' +
            esc(t.weight) + ';font-size:' + size + '">' + esc(sample) + '</span>' +
          '<span class="typo-meta">' + esc(String(t.family).split(',')[0]) + ' / ' + esc(t.weight) + '</span>' +
          '</div>';
      });
      html += '</div>';
    }

    if (d.tokens && d.tokens.length) {
      html += '<div class="design-label">Tokens</div><div class="token-grid">';
      d.tokens.forEach((t) => {
        html += '<div class="token-item"><span class="token-name">' + esc(t.name) +
          '</span><span class="token-value">' + esc(t.value) + '</span></div>';
      });
      html += '</div>';
    }

    if (d.style || d.pattern) {
      html += '<div class="design-label">Style &amp; Pattern</div>' +
        '<div class="token-grid">';
      [d.style, d.pattern].forEach((item) => {
        if (!item) return;
        html += '<div class="token-item" style="flex-direction:column;align-items:flex-start;gap:4px">' +
          '<span style="font-weight:700;color:var(--text)">' + esc(item.name) + '</span>' +
          (item.keywords ? '<span class="token-name" style="font-size:11px">' + esc(item.keywords) + '</span>' : '') +
          (item.sections ? '<span class="token-name" style="font-size:11px">' + esc(item.sections) + '</span>' : '') +
          '</div>';
      });
      html += '</div>';
      if (d.style && d.style.effects) {
        html += '<div style="margin-top:8px;font-size:12px;color:var(--muted)">' +
          '<strong style="color:var(--good)">Effects:</strong> ' + esc(d.style.effects) + '</div>';
      }
      if (d.style && d.style.antiPatterns) {
        html += '<div style="margin-top:4px;font-size:12px;color:var(--bad)">' +
          '<strong>Avoid:</strong> ' + esc(d.style.antiPatterns) + '</div>';
      }
    }

    // 자동 적용 규칙 — 사용자 결정 대상이 아니라 Coder가 따를 항목
    const ruleBlock = (label, rows, mainKey, subKeys) => {
      if (!rows || !rows.length) return '';
      let out = '<div class="design-label">' + esc(label) + '</div><div class="rule-list">';
      rows.forEach((r) => {
        const subs = subKeys
          .filter((k) => r[k.key])
          .map((k) => '<span class="' + k.cls + '">' + k.prefix + '</span> ' + esc(r[k.key]))
          .join(' · ');
        out += '<div class="rule-row">' +
          '<span class="rule-cat">' + esc(r.category || '') + '</span>' +
          '<span class="rule-body">' +
            '<span class="rule-main">' + esc(r[mainKey] || r.guideline || r.issue || '') + '</span>' +
            (subs ? '<span class="rule-sub">' + subs + '</span>' : '') +
          '</span>' +
          (r.severity ? '<span class="sev ' + esc(r.severity) + '">' + esc(r.severity) + '</span>' : '') +
          '</div>';
      });
      return out + '</div>';
    };

    // 구현 체크리스트 — ui-ux-pro-max style 도메인의 Implementation Checklist
    if (d.checklist && d.checklist.length) {
      html += '<div class="design-label">Implementation Checklist (필수 반영)</div>' +
        '<div class="impl-checklist">' +
        '<div class="impl-checklist-note">이 수치를 코드에 그대로 반영한다</div>' +
        d.checklist.map((item) =>
          '<div class="impl-item"><span class="box"></span><span>' + esc(item) + '</span></div>',
        ).join('') +
        '</div>';
    }

    html += ruleBlock('UX Rules (자동 적용)', d.uxRules, 'issue', [
      { key: 'do', cls: 'do', prefix: 'DO' },
      { key: 'dont', cls: 'dont', prefix: "DON'T" },
    ]);
    html += ruleBlock('Motion (자동 적용)', d.motion, 'desc', [
      { key: 'trigger', cls: '', prefix: 'trigger:' },
      { key: 'duration', cls: '', prefix: 'duration:' },
      { key: 'easing', cls: '', prefix: 'easing:' },
      { key: 'notes', cls: 'dont', prefix: '주의:' },
    ]);
    html += ruleBlock('Stack Guides (자동 적용)', d.stackGuides, 'guideline', [
      { key: 'do', cls: 'do', prefix: 'DO' },
    ]);

    if (d.icons && d.icons.library) {
      html += '<div class="design-label">Icons</div><div class="token-item">' +
        '<span class="token-name">' + esc(d.icons.library) + '</span>' +
        (d.icons.import ? '<span class="token-value" style="font-size:11px">' + esc(d.icons.import) + '</span>' : '') +
        '</div>';
    }

    if (d.googleFontsUrl) {
      html += '<div class="design-label">Google Fonts</div><div class="token-item">' +
        '<span class="token-name" style="font-size:11px;word-break:break-all">' +
        esc(d.googleFontsUrl) + '</span></div>';
    }

    if (d.notes) html += '<div class="design-notes">' + esc(d.notes) + '</div>';

    html += '</div>';
    mountSection(['디자인'], '디자인 시스템', html);
  })();

  // ---------------------------------------------------------------- 문제 분석 (migrate)
  (function mountIssues() {
    if (!PLAN.issues || !PLAN.issues.length) return;
    const counts = { critical: 0, warning: 0, info: 0 };
    PLAN.issues.forEach((i) => { if (counts[i.severity] != null) counts[i.severity] += 1; });

    ['critical', 'warning', 'info'].forEach((sev) => {
      if (counts[sev]) html += '<span class="issue-count ' + sev + '">' + sev + ' ' + counts[sev] + '개</span>';

    mountSection(['문제', '현재 상태 분석'], '문제 분석', html);

  // 좌측 before 파일 클릭 → 우측 FSD 트리에서 목적지 하이라이트
  function highlightMove(row) {
    const scope = document.getElementById('ba-compare');
    if (!scope) return;
    scope.querySelectorAll('.before-file.active').forEach((e) => e.classList.remove('active'));
    scope.querySelectorAll('.fsd-highlight').forEach((e) => e.classList.remove('fsd-highlight'));
    row.classList.add('active');

    const wanted = (row.getAttribute('data-move-to') || '').split('|').filter(Boolean);
    if (!wanted.length) return;

    let first = null;
    wanted.forEach((path) => {
      const target = scope.querySelector('[data-fsd-path="' + path.replace(/"/g, '\\"') + '"]');
      if (!target) return;
      target.classList.add('fsd-highlight');
      if (!first) first = target;
      // 조상 폴더를 모두 펼쳐서 대상이 실제로 보이게 한다
      let box = target.closest('.tree-folder-children');
      while (box) {
        box.classList.remove('collapsed');
        const icon = document.querySelector('[data-folder-icon="' + box.id + '"]');
        if (icon) icon.className = 'mdi mdi-folder-open';
        box = box.parentElement ? box.parentElement.closest('.tree-folder-children') : null;
      }
    });
    if (first && first.scrollIntoView) {
      setTimeout(() => first.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
  }

  // ---------------------------------------------------------------- 이벤트 위임
  document.addEventListener('click', (ev) => {
    const folder = ev.target.closest('[data-folder]');
    if (folder) {
      const id = folder.getAttribute('data-folder');
      const children = document.getElementById(id);
      const icon = document.querySelector('[data-folder-icon="' + id + '"]');
      children.classList.toggle('collapsed');
      const open = !children.classList.contains('collapsed');
      if (icon) icon.className = 'mdi ' + (open ? 'mdi-folder-open' : 'mdi-folder');
      return;
    }
    const head = ev.target.closest('[data-layer-toggle]');
    if (head) {
      head.querySelector('.arrow-icon').classList.toggle('open');
      head.nextElementSibling.classList.toggle('open');
      return;
    }
    const beforeFile = ev.target.closest('.before-file');
    if (beforeFile) highlightMove(beforeFile);
  });

  function copy(text) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast();
    });
  }
  let toastTimer;
  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  document.getElementById('btn-copy').addEventListener('click', () => copy(buildPrompt()));
  document.getElementById('btn-json').addEventListener('click', () => copy(buildJson()));
  document.getElementById('notes').addEventListener('input', render);

  render();
  applyLifecycle();
})();
</script>
</body>
</html>
